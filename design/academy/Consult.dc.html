<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S-09 상담 신청</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F6F3EC}a{color:#1E5645}a:hover{color:#123A2E}</style>
</helmet>
<div style="width: 1440px; height: 1600px; display: flex; flex-direction: column; background: #F6F3EC; color: #1B2430; font-family: 'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif">
<dc-import name="SiteHeader" active="consult" hint-size="1440px,84px"></dc-import>
<section style="padding: 72px 80px 0; display: flex; gap: 64px">
<div style="width: 440px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 15px; font-weight: 700; color: #1E5645">상담 신청</div>
<h1 style="margin: 0; font-family: 'Gowun Batang',serif; font-size: 46px; line-height: 1.3">레벨테스트는 무료,<br>결과는 원장이<br>직접 설명합니다</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; gap: 16px; padding-bottom: 24px"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #1E5645; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">1</div><div><div style="font-size: 17px; font-weight: 700">신청</div><div style="font-size: 15px; color: #5A6270; margin-top: 4px">카카오톡으로 접수 확인 메시지가 갑니다</div></div></div>
<div style="display: flex; gap: 16px; padding-bottom: 24px"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #FFFFFF; border: 2px solid #1E5645; box-sizing: border-box; color: #1E5645; display: flex; align-items: center; justify-content: center; font-weight: 700">2</div><div><div style="font-size: 17px; font-weight: 700">원장 연락</div><div style="font-size: 15px; color: #5A6270; margin-top: 4px">[영업일 기준 하루 안]에 전화드립니다</div></div></div>
<div style="display: flex; gap: 16px; padding-bottom: 24px"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #FFFFFF; border: 2px solid #1E5645; box-sizing: border-box; color: #1E5645; display: flex; align-items: center; justify-content: center; font-weight: 700">3</div><div><div style="font-size: 17px; font-weight: 700">레벨테스트 [40분]</div><div style="font-size: 15px; color: #5A6270; margin-top: 4px">전날 카카오톡으로 시간을 다시 알려드립니다</div></div></div>
<div style="display: flex; gap: 16px"><div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #FFFFFF; border: 2px solid #1E5645; box-sizing: border-box; color: #1E5645; display: flex; align-items: center; justify-content: center; font-weight: 700">4</div><div><div style="font-size: 17px; font-weight: 700">결과 상담·반 추천</div><div style="font-size: 15px; color: #5A6270; margin-top: 4px">등록은 충분히 생각해보고 정하셔도 됩니다</div></div></div>
</div>
</div>
<div style="flex: 1; padding: 44px; background: #FFFFFF; border-radius: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-name" style="font-size: 14px; font-weight: 600">학부모 성함</label><input id="c-name" type="text" placeholder="홍길동" style="height: 52px; padding: 0 16px; border: 1px solid #C9C2B4; border-radius: 10px; font: inherit; font-size: 16px; background: #FBFAF7"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-tel" style="font-size: 14px; font-weight: 600">연락처</label><input id="c-tel" type="tel" placeholder="010-0000-0000" style="height: 52px; padding: 0 16px; border: 1px solid #C9C2B4; border-radius: 10px; font: inherit; font-size: 16px; background: #FBFAF7"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-grade" style="font-size: 14px; font-weight: 600">학생 학년</label><select id="c-grade" style="height: 52px; padding: 0 12px; border: 1px solid #C9C2B4; border-radius: 10px; font: inherit; font-size: 16px; background: #FBFAF7"><option>학년 선택</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-school" style="font-size: 14px; font-weight: 600">학교 (선택)</label><input id="c-school" type="text" placeholder="OO중학교" style="height: 52px; padding: 0 16px; border: 1px solid #C9C2B4; border-radius: 10px; font: inherit; font-size: 16px; background: #FBFAF7"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 14px; font-weight: 600">원하시는 상담</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="height: 52px; border: 2px solid #1E5645; border-radius: 10px; background: #E4EEE9; color: #1E5645; font: inherit; font-weight: 700">레벨테스트 예약</button>
<button type="button" aria-pressed="false" style="height: 52px; border: 1px solid #C9C2B4; border-radius: 10px; background: #FFFFFF; font: inherit">전화 상담</button>
<button type="button" aria-pressed="false" style="height: 52px; border: 1px solid #C9C2B4; border-radius: 10px; background: #FFFFFF; font: inherit">방문 상담</button>
</div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 14px; font-weight: 600">희망 테스트 시간</div>
<div style="display: flex; gap: 8px">
<button type="button" style="height: 48px; padding: 0 18px; border: 1px solid #C9C2B4; border-radius: 10px; background: #FFFFFF; font: inherit">화 18:00</button>
<button type="button" style="height: 48px; padding: 0 18px; border: 2px solid #1E5645; border-radius: 10px; background: #E4EEE9; color: #1E5645; font: inherit; font-weight: 700">목 17:00</button>
<button type="button" style="height: 48px; padding: 0 18px; border: 1px solid #C9C2B4; border-radius: 10px; background: #FFFFFF; font: inherit">토 11:00</button>
<button type="button" style="height: 48px; padding: 0 18px; border: 1px solid #C9C2B4; border-radius: 10px; background: #FFFFFF; font: inherit">다른 시간 원해요</button>
</div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-msg" style="font-size: 14px; font-weight: 600">궁금한 점 (선택)</label><textarea id="c-msg" placeholder="아이의 현재 상황이나 궁금한 점을 적어주세요" style="height: 96px; padding: 14px 16px; border: 1px solid #C9C2B4; border-radius: 10px; font: inherit; font-size: 16px; background: #FBFAF7; resize: none"></textarea></div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; background: #F6F3EC; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 10px"><input id="c-a1" type="checkbox" style="width: 20px; height: 20px"><label for="c-a1" style="font-size: 15px"><b>[필수]</b> 개인정보 수집·이용 동의</label><a href="#" style="margin-left: auto; font-size: 14px">보기</a></div>
<div style="display: flex; align-items: center; gap: 10px"><input id="c-a2" type="checkbox" style="width: 20px; height: 20px"><label for="c-a2" style="font-size: 15px"><b>[선택]</b> 특강·모집 안내 수신 동의 (카카오톡·문자)</label><a href="#" style="margin-left: auto; font-size: 14px">보기</a></div>
<div style="display: flex; align-items: center; gap: 10px; padding-left: 30px"><input id="c-a3" type="checkbox" style="width: 20px; height: 20px"><label for="c-a3" style="font-size: 14px; color: #3E4652">[선택] 21시~08시 수신 동의</label></div>
</div>
<a href="ConsultDone.dc.html" style="height: 60px; border-radius: 12px; background: #1E5645; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">상담 신청하기</a>
</div>
</section>
<div style="flex-grow: 1; margin-top: 120px; background: #1B2430"><dc-import name="SiteFooter" hint-size="1440px,200px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
