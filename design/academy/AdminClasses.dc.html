<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A-07 수업·시간표 관리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4F2EE}a{color:#1E5645}a:hover{color:#123A2E}</style>
</helmet>
<div style="width: 1440px; height: 1000px; display: flex; background: #F4F2EE; color: #1B2430; font-family: 'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; font-variant-numeric: tabular-nums">
<dc-import name="AdminSide" active="classes" hint-size="240px,1000px"></dc-import>
<main style="flex: 1; padding: 32px 40px; display: flex; gap: 20px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center"><h1 style="margin: 0; font-size: 26px; font-weight: 700">수업·시간표</h1><button type="button" style="height: 44px; padding: 0 18px; border: none; border-radius: 8px; background: #1E5645; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">반 추가</button></div>
<div style="background: #FFFFFF; border-radius: 12px; overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<thead><tr style="text-align: left; color: #5A6270; background: #FAF9F6"><th style="padding: 14px 16px; font-weight: 600">반</th><th style="padding: 14px 16px; font-weight: 600">요일·시간</th><th style="padding: 14px 16px; font-weight: 600">잔여석</th></tr></thead>
<tbody>
<tr style="border-top: 1px solid #EEEAE2; background: #EEF5F1"><td style="padding: 14px 16px; font-weight: 600">[중1 기본반]</td><td style="padding: 14px 16px">월·수·금 17:00</td><td style="padding: 8px 16px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" aria-label="잔여석 줄이기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">−</button><b style="width: 20px; text-align: center">2</b><button type="button" aria-label="잔여석 늘리기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">+</button></div></td></tr>
<tr style="border-top: 1px solid #EEEAE2"><td style="padding: 14px 16px; font-weight: 600">[중2 내신반]</td><td style="padding: 14px 16px">화·목 18:00</td><td style="padding: 8px 16px; color: #8A3A1C; font-weight: 600">마감 · 대기 3명</td></tr>
<tr style="border-top: 1px solid #EEEAE2"><td style="padding: 14px 16px; font-weight: 600">[중3 선행반]</td><td style="padding: 14px 16px">월·수·금 19:00</td><td style="padding: 8px 16px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" aria-label="잔여석 줄이기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">−</button><b style="width: 20px; text-align: center">4</b><button type="button" aria-label="잔여석 늘리기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">+</button></div></td></tr>
<tr style="border-top: 1px solid #EEEAE2"><td style="padding: 14px 16px; font-weight: 600">[고1 내신반]</td><td style="padding: 14px 16px">화·목·토 19:00</td><td style="padding: 8px 16px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" aria-label="잔여석 줄이기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">−</button><b style="width: 20px; text-align: center">3</b><button type="button" aria-label="잔여석 늘리기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">+</button></div></td></tr>
<tr style="border-top: 1px solid #EEEAE2"><td style="padding: 14px 16px; font-weight: 600">[고2 수학Ⅰ·Ⅱ]</td><td style="padding: 14px 16px">월·수 19:30</td><td style="padding: 8px 16px"><div style="display: flex; align-items: center; gap: 8px"><button type="button" aria-label="잔여석 줄이기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">−</button><b style="width: 20px; text-align: center">1</b><button type="button" aria-label="잔여석 늘리기" style="width: 36px; height: 36px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">+</button></div></td></tr>
</tbody>
</table>
</div>
<div style="padding: 24px; background: #FFFFFF; border-radius: 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 16px; font-weight: 700">레벨테스트 가능 시간</div><div style="font-size: 13px; color: #5A6270">매주 월요일 오전, 이번 주 시간 확인 알림이 원장님께 갑니다</div></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #1E5645; border-radius: 8px; background: #E4EEE9; color: #1E5645; font: inherit; font-size: 14px; font-weight: 600">화 18:00 ✕</button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #1E5645; border-radius: 8px; background: #E4EEE9; color: #1E5645; font: inherit; font-size: 14px; font-weight: 600">목 17:00 ✕</button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #1E5645; border-radius: 8px; background: #E4EEE9; color: #1E5645; font: inherit; font-size: 14px; font-weight: 600">토 11:00 ✕</button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px dashed #B7B0A2; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px">+ 시간 추가</button>
</div>
</div>
</div>
<div style="width: 420px; padding: 24px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 16px; font-weight: 700">[중1 기본반] 편집</div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="k-name" style="font-size: 13px; font-weight: 600; color: #5A6270">반 이름</label><input id="k-name" type="text" placeholder="중1 기본반" style="height: 44px; padding: 0 12px; border: 1px solid #D5D0C6; border-radius: 8px; font: inherit; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="font-size: 13px; font-weight: 600; color: #5A6270">요일</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 8px; background: #1E5645; color: #FFFFFF; font: inherit; font-weight: 600">월</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">화</button>
<button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 8px; background: #1E5645; color: #FFFFFF; font: inherit; font-weight: 600">수</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">목</button>
<button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 8px; background: #1E5645; color: #FFFFFF; font: inherit; font-weight: 600">금</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #D5D0C6; border-radius: 8px; background: #FFFFFF; font: inherit">토</button>
</div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="k-time" style="font-size: 13px; font-weight: 600; color: #5A6270">시간</label><input id="k-time" type="text" placeholder="17:00 – 18:40" style="height: 44px; padding: 0 12px; border: 1px solid #D5D0C6; border-radius: 8px; font: inherit; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="k-cap" style="font-size: 13px; font-weight: 600; color: #5A6270">정원</label><input id="k-cap" type="number" placeholder="8" style="height: 44px; padding: 0 12px; border: 1px solid #D5D0C6; border-radius: 8px; font: inherit; font-size: 14px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="k-book" style="font-size: 13px; font-weight: 600; color: #5A6270">교재</label><input id="k-book" type="text" placeholder="교재명" style="height: 44px; padding: 0 12px; border: 1px solid #D5D0C6; border-radius: 8px; font: inherit; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="k-desc" style="font-size: 13px; font-weight: 600; color: #5A6270">소개 (한두 문장)</label><textarea id="k-desc" style="height: 80px; padding: 10px 12px; border: 1px solid #D5D0C6; border-radius: 8px; font: inherit; font-size: 14px; resize: none"></textarea></div>
<button type="button" style="margin-top: auto; height: 48px; border: none; border-radius: 10px; background: #1E5645; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">저장하면 홈페이지에 바로 반영</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
