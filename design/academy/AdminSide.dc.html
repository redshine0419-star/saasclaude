class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dashboard';
    const keys = ['dashboard', 'leads', 'kakao', 'kakaolog', 'news', 'reviews', 'classes', 'info', 'report', 'settings'];
    const bg = {}, c = {}, w = {};
