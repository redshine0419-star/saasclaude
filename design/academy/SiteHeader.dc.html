<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","about","classes","fee","reviews","news","location","consult"]},"$preview":{"width":1440,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const keys = ['about', 'classes', 'fee', 'reviews', 'news', 'location'];
    const c = {}, w = {}, b = {};
    keys.forEach((k) => {
      c[k] = k === a ? '#1E5645' : '#1B2430';
      w[k] = k === a ? '700' : '500';
      b[k] = k === a ? '#1E5645' : 'transparent';
    });
    return { c, w, b };
  }
}
