<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공통 · 운영자 사이드바</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside style="width: 240px; height: 1000px; box-sizing: border-box; padding: 24px 16px; background: #14213D; color: #B8C0CF; font-family: 'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 12px 6px"><svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#F5B700"></circle><circle cx="11" cy="11" r="3.5" fill="#14213D"></circle></svg><span style="font-size: 18px; font-weight: 700; color: #FFFFFF">첫등원</span></div>
<div style="padding: 0 12px 20px; font-size: 12px; color: #8E99AE">운영자 콘솔</div>
<a href="PlatAcademies.dc.html" style="padding: 11px 12px; border-radius: 8px; background: {{bg.acad}}; color: {{c.acad}}; font-weight: {{w.acad}}; text-decoration: none; font-size: 15px; display: flex; justify-content: space-between">학원<span style="font-size: 13px; color: #8E99AE">[24]</span></a>
<a href="PlatQueue.dc.html" style="padding: 11px 12px; border-radius: 8px; background: {{bg.queue}}; color: {{c.queue}}; font-weight: {{w.queue}}; text-decoration: none; font-size: 15px; display: flex; justify-content: space-between">베타 신청·제작<span style="min-width: 22px; padding: 0 6px; border-radius: 11px; background: #F5B700; color: #14213D; font-size: 12px; font-weight: 700; text-align: center; line-height: 22px">2</span></a>
<a href="PlatDiagnosis.dc.html" style="padding: 11px 12px; border-radius: 8px; background: {{bg.diag}}; color: {{c.diag}}; font-weight: {{w.diag}}; text-decoration: none; font-size: 15px; display: flex; justify-content: space-between">무료 진단<span style="min-width: 22px; padding: 0 6px; border-radius: 11px; background: #F5B700; color: #14213D; font-size: 12px; font-weight: 700; text-align: center; line-height: 22px">4</span></a>
<a href="PlatSettings.dc.html" style="padding: 11px 12px; border-radius: 8px; background: {{bg.set}}; color: {{c.set}}; font-weight: {{w.set}}; text-decoration: none; font-size: 15px">서비스 설정</a>
<div style="margin-top: auto; padding: 12px; font-size: 13px; color: #8E99AE">[운영자 이름] · 로그아웃</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"acad","options":["acad","queue","diag","set"]},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'acad';
    const bg = {}, c = {}, w = {};
    ['acad', 'queue', 'diag', 'set'].forEach((k) => {
      bg[k] = k === a ? '#24345A' : 'transparent';
      c[k] = k === a ? '#FFFFFF' : '#B8C0CF';
      w[k] = k === a ? '600' : '400';
    });
    return { bg, c, w };
  }
}
</script>
</body>
</html>
