<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공통 · 헤더</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.fd-menu{display:none}@media (max-width: 760px){.fd-nav{display:none !important}.fd-menu{display:flex !important}.fd-cta{height:40px !important;padding:0 14px !important;font-size:14px !important}}</style>
</helmet>
<header style="width: 100%; height: 76px; box-sizing: border-box; padding: 0 clamp(20px, 4vw, 56px); display: flex; align-items: center; justify-content: space-between; gap: 24px; background: #FFFFFF; border-bottom: 1px solid #E3E7EE; color: #14213D; font-family: 'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; color: #14213D; text-decoration: none; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#F5B700"></circle><circle cx="11" cy="11" r="3.5" fill="#14213D"></circle></svg>
<span style="font-size: 23px; font-weight: 700; letter-spacing: -0.5px">첫등원</span>
</a>
<nav class="fd-nav" aria-label="주 메뉴" style="display: flex; gap: clamp(16px, 2.4vw, 36px); font-size: 15px; overflow-x: auto; white-space: nowrap">
<a href="Service.dc.html" style="color: {{c.service}}; font-weight: {{w.service}}; text-decoration: none; padding: 26px 0 23px; border-bottom: 3px solid {{b.service}}">서비스 소개</a>
<a href="Demo.dc.html" style="color: {{c.demo}}; font-weight: {{w.demo}}; text-decoration: none; padding: 26px 0 23px; border-bottom: 3px solid {{b.demo}}">데모 보기</a>
<a href="Pricing.dc.html" style="color: {{c.pricing}}; font-weight: {{w.pricing}}; text-decoration: none; padding: 26px 0 23px; border-bottom: 3px solid {{b.pricing}}">요금</a>
<a href="Consult.dc.html" style="color: {{c.consult}}; font-weight: {{w.consult}}; text-decoration: none; padding: 26px 0 23px; border-bottom: 3px solid {{b.consult}}">상담</a>
<a href="Apply.dc.html" style="color: {{c.apply}}; font-weight: {{w.apply}}; text-decoration: none; padding: 26px 0 23px; border-bottom: 3px solid {{b.apply}}">베타 신청</a>
</nav>
<div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0"><a class="fd-cta" href="Consult.dc.html" style="flex-shrink: 0; height: 44px; padding: 0 18px; border-radius: 10px; background: #14213D; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center">무료 진단 받기</a>
<button class="fd-menu" type="button" aria-label="메뉴 열기" style="width: 44px; height: 44px; border: none; background: transparent; color: #14213D; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button></div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","service","demo","pricing","consult","apply"]},"$preview":{"width":1440,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const c = {}, w = {}, b = {};
    ['service', 'demo', 'pricing', 'consult', 'apply'].forEach((k) => {
      c[k] = k === a ? '#14213D' : '#4A5568';
      w[k] = k === a ? '700' : '500';
      b[k] = k === a ? '#F5B700' : 'transparent';
    });
    return { c, w, b };
  }
}
</script>
</body>
</html>
